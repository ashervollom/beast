<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <title>Beast</title>
  <link rel="icon" type="image/svg+xml" href="/brand/beast-logo.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/brand/beast-logo-cream.svg" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/board.css" />
  <style>
    main { max-width: 760px; margin: 0 auto; padding: 44px 32px 80px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 44px; }
    .wordmark { font: 400 32px/1 var(--serif); letter-spacing: -0.02em; text-decoration: none; }
    .sync { color: var(--muted); font-size: 14px; }
    footer { color: var(--muted); font-size: 14px; }
    footer a { color: var(--ink-2); }
    @media (max-width: 820px) {
      main { padding: 22px 16px 64px; }
      .wordmark { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <header><a class="wordmark" href="/signin">Beast</a><span class="sync" id="sync"></span></header>
    <div id="board"><p class="desc">Loading…</p></div>
    <footer>Your private board. <a href="/signin">Sign in</a> for your classes and settings.</footer>
  </main>
  <script type="module">
    import { boardHtml } from "/board.js";
    // Each user's board lives at /dashboard/<slug>; the slug is the only key to their data.
    const slug = location.pathname.split("/")[2] || "";
    const ago = (iso) => {
      const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
      return min < 1 ? "just now" : min < 60 ? `${min} min ago` : min < 1440 ? `${Math.round(min / 60)}h ago` : `${Math.round(min / 1440)}d ago`;
    };
    let last = "";
    async function refresh() {
      const res = await fetch(`/api/viz/${encodeURIComponent(slug)}`).catch(() => null);
      if (!res?.ok) {
        if (res?.status === 404) document.getElementById("board").innerHTML = `<p class="desc">This board link doesn't work anymore. Text Beast <b>new dashboard link</b> for a fresh one.</p>`;
        return;
      }
      const data = await res.json();
      if (data.name) document.title = `${data.name}'s board · Beast`;
      const synced = data.canvas?.lastPlannerSyncAt || data.canvas?.lastSyncAt;
      document.getElementById("sync").textContent = data.canvas?.connected ? (synced ? `Canvas synced ${ago(synced)}` : "Syncing Canvas…") : "";
      // Only redraw when something changed, so links don't flicker under your finger.
      const html = boardHtml(data.assignments);
      if (html !== last) document.getElementById("board").innerHTML = last = html;
    }
    refresh();
    setInterval(refresh, 30_000);
  </script>
</body>
</html>
