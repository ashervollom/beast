<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Sign in to Beast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/theme.css" />
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .box { width: 100%; max-width: 420px; }
    h1 { font: 400 clamp(34px, 6vw, 44px)/1.1 var(--serif); letter-spacing: -0.02em; margin: 0 0 12px; }
    .sub { color: var(--muted); margin: 0 0 36px; }
    .phone {
      display: flex; align-items: center; gap: 12px;
      border: 1px solid var(--rule); border-radius: var(--radius); background: var(--field);
      padding: 0 16px; height: 56px;
    }
    .phone span { color: var(--muted); padding-right: 12px; border-right: 1px solid var(--rule); }
    .phone input, .codes input { border: 0; outline: none; background: transparent; color: var(--ink); font: 400 18px/1 var(--sans); }
    .phone input { flex: 1; min-width: 0; height: 100%; }
    .phone:focus-within, .codes input:focus { border-color: var(--ink-2); }
    .fine { color: var(--muted); font-size: 14px; margin: 18px 0 28px; line-height: 1.6; }
    .btn {
      width: 100%; height: 54px; border: 0; border-radius: var(--radius);
      background: var(--ink); color: var(--paper); font: 600 16px/1 var(--sans); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn[disabled] { opacity: 0.55; cursor: default; }
    .codes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 8px 0 28px; }
    .codes input {
      width: 100%; aspect-ratio: 0.9; text-align: center; font-size: 26px;
      border: 1px solid var(--rule); border-radius: var(--radius); background: var(--field);
    }
    .msg { min-height: 22px; font-size: 14px; color: var(--muted); margin: 14px 0 0; }
    .msg.error { color: var(--danger); }
    .links { font-size: 14px; color: var(--muted); line-height: 1.7; }
    .links button { background: none; border: 0; padding: 0; font: inherit; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .links button[disabled] { color: var(--muted); cursor: default; }
    .fade { animation: fade 320ms ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <main><div class="box" id="box"></div></main>
  <script type="module">
    const box = document.getElementById("box");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    let phone = "";
    let shown = "";
    let timer = null;

    async function post(path, body) {
      const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => null);
      const data = res ? await res.json().catch(() => ({})) : {};
      return { ok: Boolean(res?.ok), data };
    }

    function phoneStep(error = "") {
      box.innerHTML = `
        <form class="fade" id="f" novalidate>
          <h1>Sign in to Beast</h1>
          <p class="sub">We'll text you a code in iMessage.</p>
          <label class="phone"><span>+1</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(555) 000-0000" aria-label="Phone number" value="${esc(phone)}" /></label>
          <p class="fine">Use the number you text Beast from. By continuing you agree to Beast's <a href="/privacy">privacy terms</a>.</p>
          <button class="btn" id="go">Send code <span aria-hidden="true">→</span></button>
          <p class="msg ${error ? "error" : ""}" id="msg">${esc(error)}</p>
        </form>`;
      const input = document.getElementById("phone");
      input.focus();
      document.getElementById("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        phone = input.value.trim();
        if (!phone) return input.focus();
        const btn = document.getElementById("go");
        btn.disabled = true;
        const { ok, data } = await post("/api/auth/start", { phone });
        if (!ok) {
          btn.disabled = false;
          const m = document.getElementById("msg");
          m.className = "msg error";
          m.textContent = data.error || "Couldn't reach Beast. Try again.";
          return;
        }
        shown = data.phone;
        codeStep(data.resendInSec ?? 30);
      });
    }

    function codeStep(wait) {
      box.innerHTML = `
        <form class="fade" id="f" novalidate>
          <h1>Enter your code</h1>
          <p class="sub">If ${esc(shown)} is on Beast, we just iMessaged it a 6-digit code.</p>
          <div class="codes">${Array.from({ length: 6 }, (_, i) => `<input inputmode="numeric" aria-label="Digit ${i + 1}" ${i === 0 ? 'autocomplete="one-time-code"' : ""} />`).join("")}</div>
          <p class="links">No code yet? Check iMessage from Beast.<br><button type="button" id="resend" disabled>Send a new code in ${wait}s</button> or <button type="button" id="change">change number</button>.</p>
          <p class="msg" id="msg"></p>
        </form>`;
      const inputs = [...box.querySelectorAll(".codes input")];
      inputs[0].focus();
      const code = () => inputs.map((i) => i.value).join("");
      const submit = async () => {
        if (code().length !== 6) return;
        inputs.forEach((i) => (i.disabled = true));
        const { ok, data } = await post("/api/auth/verify", { phone, code: code() });
        if (ok) return void location.assign("/app");
        inputs.forEach((i) => ((i.disabled = false), (i.value = "")));
        inputs[0].focus();
        const m = document.getElementById("msg");
        m.className = "msg error";
        m.textContent = data.error || "That code didn't work.";
      };
      inputs.forEach((input, i) => {
        input.addEventListener("input", () => {
          const digits = input.value.replace(/\D/g, "");
          // Pasting or autofilling the code (no maxlength, so it isn't cut off) fills every box from here on.
          if (digits.length > 1) {
            const start = digits.length >= 6 ? 0 : i;
            digits.slice(0, 6 - start).split("").forEach((d, j) => (inputs[start + j].value = d));
            inputs[Math.min(5, start + digits.length - 1)].focus();
          } else {
            input.value = digits;
            if (digits && inputs[i + 1]) inputs[i + 1].focus();
          }
          submit();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && inputs[i - 1]) inputs[i - 1].focus();
        });
      });
      const resend = document.getElementById("resend");
      let left = wait;
      clearInterval(timer);
      timer = setInterval(() => {
        left--;
        if (left <= 0) {
          clearInterval(timer);
          resend.disabled = false;
          resend.textContent = "Send a new code";
        } else resend.textContent = `Send a new code in ${left}s`;
      }, 1000);
      resend.onclick = async () => {
        resend.disabled = true;
        const { data } = await post("/api/auth/start", { phone });
        codeStep(data.resendInSec ?? 30);
      };
      document.getElementById("change").onclick = () => phoneStep();
    }

    phoneStep();
  </script>
</body>
</html>
